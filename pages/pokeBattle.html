<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/pokeBattle.css">
    <link rel="shortcut icon" href="./assets/img/favicon-pokebola.png" type="image/x-icon">
    <title>Pokémon - Battle Simulator</title>
</head>
<body>

    <header>

        <audio controls autoplay loop>
            <source src="../assets/aud/BattleMusi.mp3" type="audio/mpeg">
        </audio>

    </header>

    <main>

        <div class="player">
            <img src="../assets/img/test2.gif" alt="pokemon" class="imgPoke-player">
            <img src="../assets/img/player-hp.png" alt="playerHP" class="playerHp">
            <img src="../assets/img/menu-player.png" alt="menuPlayer" class="menuPlayer">
            
        </div>

        <div class="inimigo">
            <img src="../assets/img/test.gif" alt="pokemon" class="imgPoke-inimigo">
        </div>

        

        <img src="../assets/img/fundo.png" alt="fundo" class="fundo">
    </main>

    <script src="../assets/js/pokeBattle.js"></script>
</body>
</html>
